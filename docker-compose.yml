version: '3.9'

services:
  postgres:
    image: postgres:latest
    restart: always
    expose:
      - 5432
    env_file:
      - .env
    networks:
      - network01
    volumes: 
      - postgres:/var/lib/postgresql/data

  bot: &app
    command: python3 bot/main.py
    build: .
    environment:
      PYTHONPATH: /usr/src/app
    env_file:
      - .env
    volumes:
      - ./:/usr/src/app
    depends_on:
      - postgres
    networks:
      - network01

  backend:
    <<: *app
    ports:
      - "8000:8000"
    entrypoint: ["sh", "-c", "alembic upgrade head && python3 backend/main.py"]

volumes:
  postgres:
    driver: local

networks:
  network01:
    name: for-db-1
    external: false